# Alembic configuration — DataPilot AI Pro
# The database URL is resolved at runtime in alembic/env.py (PostgreSQL from
# DATABASE_URL, SQLite fallback on dev machines) so it is never hardcoded here.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is set programmatically in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
